<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Context broom">
  <defs>
    <linearGradient id="cb-chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3342"/>
      <stop offset="1" stop-color="#161a22"/>
    </linearGradient>
    <linearGradient id="cb-ramp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ecc71"/>
      <stop offset="0.55" stop-color="#f5d14e"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#cb-chip)"/>

  <!-- frame = usage gauge track -->
  <rect x="8" y="8" width="48" height="48" rx="13" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>
  <!-- frame = usage gauge level (72% of the perimeter) -->
  <rect x="8" y="8" width="48" height="48" rx="13" fill="none" stroke="url(#cb-ramp)" stroke-width="3"
        stroke-linecap="round" pathLength="100" stroke-dasharray="72 100" transform="rotate(-90 32 32)"/>

  <g transform="translate(8 8) scale(3)" stroke-linecap="round" fill="none">
    <path d="M5.4 9.3 L8.6 10.4 L7.4 13.1 L4.2 12.2 Z" fill="#ffffff" fill-opacity="0.16" stroke="none"/>
    <path d="M10.7 3.1 L7.5 8.4" stroke="#f4f7fb" stroke-width="1.15"/>
    <path d="M5.5 8.9 L8.7 9.9" stroke="#f4f7fb" stroke-width="1.15"/>
    <path d="M5.6 9.7 L4.1 12.5" stroke="#f4f7fb" stroke-width="0.9"/>
    <path d="M6.6 10.1 L5.8 12.9" stroke="#f4f7fb" stroke-width="0.9"/>
    <path d="M7.6 10.5 L7.4 13.1" stroke="#f4f7fb" stroke-width="0.9"/>
  </g>
</svg>
